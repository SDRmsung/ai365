        body {

            color: var(--text-primary);

            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .top-bar {

            top: 0;
            left: 0;
            right: 0;

            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        .brand {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-cyan);
            background: var(--accent-cyan-glow);
        }

        .layout-container {
            display: flex;
            width: 100%;
            height: 100%;
            padding-top: 56px;
        }

        /* Sidebar */
        .sidebar {
            width: 380px;
            min-width: 340px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .search-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--accent-cyan);
        }
        .tree-container {
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .tree-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding: 12px 10px 4px 10px;
        }
        .tree-node {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;

            color: var(--text-primary);

            -webkit-text-fill-color: transparent;
        }
        .hero-desc {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .bento-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 22px;

            transition: all 0.2s ease;

            overflow: hidden;

            background: var(--card-hover-bg);

            font-weight: 600;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 8px;

            font-size: 1.15rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #fff;

        .bento-card-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 0;
        }

            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 32px;

            align-items: center;
            margin-bottom: 16px;

            padding: 3px 8px;

            font-weight: 700;
            color: #fff;
            margin: 0 0 8px 0;

        .detail-subtitle {

            color: var(--text-secondary);

            color: var(--text-primary);
